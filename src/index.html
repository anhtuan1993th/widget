<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroPulse Widget</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root" class="widget-root expanded">

    <!-- ========================================================== -->
    <!-- 1. MINI PILL (click để mở rộng / thu nhỏ, kéo để di chuyển) -->
    <!-- ========================================================== -->
    <div id="miniPill" class="mini-pill" data-drag title="Kéo để di chuyển | Click để mở rộng/thu nhỏ">
      <div class="pill-stats">
        <div class="pill-col">
          <span class="pill-label">CPU</span>
          <span id="pillCpuUsage" class="pill-value mono">--%</span>
        </div>

        <div class="pill-divider" data-temp></div>
        <div class="pill-col" data-temp>
          <span class="pill-label">CPU TEMP</span>
          <span id="pillCpuTemp" class="pill-value mono">--°C</span>
        </div>

        <div class="pill-divider"></div>
        <div class="pill-col">
          <span class="pill-label">RAM</span>
          <span id="pillRamUsage" class="pill-value mono">--%</span>
        </div>

        <div class="pill-divider"></div>
        <div class="pill-col">
          <span class="pill-label">NET ↓ / ↑</span>
          <span class="pill-value mono"><span id="pillNetDown">0 KB/s</span><span class="pill-net-up"> / <span id="pillNetUp">0 KB/s</span></span></span>
        </div>

        <button id="btnToggleMode" class="pill-toggle" data-no-drag title="Mở rộng / Thu nhỏ">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>

      <div class="pill-date">
        <span class="pill-date-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          <span id="pillSolar">--</span>
        </span>
        <span class="pill-date-item lunar">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <span id="pillLunar">--</span>
        </span>
      </div>
    </div>

    <!-- ========================================================== -->
    <!-- 2. EXPANDED CARD                                           -->
    <!-- ========================================================== -->
    <div id="expandedCard" class="expanded-card">

      <div class="card-header" data-drag>
        <div class="card-brand">
          <span class="brand-dot"></span>
          <span>AeroPulse Widget</span>
        </div>
        <button id="btnCollapse" class="btn-ghost" data-no-drag title="Thu nhỏ">▲ Thu nhỏ</button>
      </div>

      <!-- CPU & RAM gauges -->
      <div class="gauges-row">
        <div class="gauge-svg-wrapper" id="cpuGaugeBox">
          <svg class="gauge-svg" viewBox="0 0 110 110">
            <circle cx="55" cy="55" r="43" class="gauge-track" />
            <circle id="circleCpu" cx="55" cy="55" r="43" class="gauge-progress" />
          </svg>
          <div class="gauge-content">
            <span class="gauge-title">CPU</span>
            <span id="cardCpuUsage" class="gauge-number mono">--%</span>
            <span id="cardCpuTemp" class="gauge-subtext mono">--°C</span>
          </div>
        </div>

        <div class="gauge-svg-wrapper">
          <svg class="gauge-svg" viewBox="0 0 110 110">
            <circle cx="55" cy="55" r="43" class="gauge-track" />
            <circle id="circleRam" cx="55" cy="55" r="43" class="gauge-progress" />
          </svg>
          <div class="gauge-content">
            <span class="gauge-title">RAM</span>
            <span id="cardRamUsage" class="gauge-number mono">--%</span>
            <span id="cardRamSize" class="gauge-subtext mono">-- / -- GB</span>
            <span id="cardRamTemp" class="gauge-subtext mono" hidden>--°C</span>
          </div>
        </div>
      </div>

      <!-- Disks -->
      <div class="sub-card">
        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Ổ đĩa</span>
        </div>
        <div id="diskList" class="disk-list"></div>
      </div>

      <!-- Network -->
      <div class="network-row">
        <div class="net-box">
          <div class="net-header">
            <span class="net-label"><span class="net-arrow">↓</span>DOWNLOAD</span>
            <span id="cardDownVal" class="net-value mono">0 KB/s</span>
          </div>
          <canvas id="downCanvas" class="net-canvas"></canvas>
        </div>
        <div class="net-box">
          <div class="net-header">
            <span class="net-label"><span class="net-arrow">↑</span>UPLOAD</span>
            <span id="cardUpVal" class="net-value mono">0 KB/s</span>
          </div>
          <canvas id="upCanvas" class="net-canvas"></canvas>
        </div>
      </div>

      <!-- Lịch âm dương -->
      <div class="calendar-card">
        <div class="cal-header">
          <div class="section-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
            <span>Lịch âm dương</span>
          </div>
          <span id="calWeekday" class="cal-weekday">--</span>
        </div>

        <div class="cal-body">
          <div class="cal-col">
            <span class="cal-kind">Dương lịch</span>
            <span id="solarDay" class="cal-day">--</span>
            <span id="solarMonthYear" class="cal-sub">--</span>
          </div>
          <div class="cal-divider"></div>
          <div class="cal-col lunar">
            <span class="cal-kind">Âm lịch</span>
            <span id="lunarDay" class="cal-day">--</span>
            <span id="lunarMonthYear" class="cal-sub">--</span>
          </div>
        </div>

        <div class="cal-footer">
          <div class="cal-chip"><span>Ngày</span><b id="canChiDay">--</b></div>
          <div class="cal-chip"><span>Tháng</span><b id="canChiMonth">--</b></div>
          <div class="cal-chip"><span>Giờ</span><b id="canChiHour">--</b></div>
          <div class="cal-chip"><span>Tiết khí</span><b id="tietKhi">--</b></div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
